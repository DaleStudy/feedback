name: Preview 🔍

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # 포크 PR에는 secret이 전달되지 않으므로 같은 저장소의 PR만 미리보기를 만든다
    if: >
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # 미리보기끼리 함께 쓰는 D1(feedback-preview)에 마이그레이션을 먼저 적용한다
      - name: Migrate preview D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run db:migrate:preview

      - run: bun run build

      - name: Write secrets file
        env:
          GITHUB_CLIENT_SECRET: ${{ secrets.APP_CLIENT_SECRET }}
        run: printf 'GITHUB_CLIENT_SECRET=%s\n' "$GITHUB_CLIENT_SECRET" > "$RUNNER_TEMP/secrets.env"

      - name: Deploy preview
        id: preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: bun
          command: preview --name pr-${{ github.event.pull_request.number }} --secrets-file ${{ runner.temp }}/secrets.env

      - name: Render comment
        if: always()
        env:
          STATUS: ${{ steps.preview.outcome == 'success' && '✅ Ready' || '❌ Failed' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_URL: <a href='https://pr-${{ github.event.pull_request.number }}.feedback-preview.dalestudy.com'>Preview URL</a>
        run: |
          SHORT_SHA="${HEAD_SHA::8}"
          NOW="$(date -u '+%b %d %Y, %I:%M %p')"
          export SHORT_SHA NOW
          envsubst < .github/preview-comment.md > comment.md

      - name: Comment
        if: always()
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: cloudflare-workers
          path: comment.md

  cleanup:
    if: >
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Delete preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: bun
          command: preview delete --name pr-${{ github.event.pull_request.number }} -y
